<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 320px; margin: 0; padding: 14px 14px 16px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; opacity: .6; margin: 0 0 6px;
    }
    section + section { margin-top: 18px; }
    .row { display: flex; gap: 6px; }
    input {
      flex: 1; min-width: 0; padding: 7px 9px; font: inherit; color: inherit;
      background: transparent; border: 1px solid rgba(128,128,128,.45); border-radius: 7px;
    }
    button {
      padding: 7px 11px; font: inherit; color: inherit; cursor: pointer;
      background: transparent; border: 1px solid rgba(128,128,128,.45); border-radius: 7px;
      white-space: nowrap;
    }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    button.small { padding: 3px 8px; font-size: 12px; }
    button.remove { border: none; padding: 2px 6px; opacity: .5; }
    button.remove:hover { opacity: 1; }
    .status {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      padding: 8px 10px; border-radius: 8px; background: rgba(128,128,128,.12);
    }
    .status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #999; }
    .status.on .dot { background: #2ea043; }
    .status .text { flex: 1; }
    .status b { font-weight: 600; }
    ul.rules { list-style: none; margin: 0 0 8px; padding: 0; }
    ul.rules li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    ul.rules .match { flex: 1; min-width: 0; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    ul.rules .arrow { opacity: .4; }
    ul.rules .folder { font-weight: 600; white-space: nowrap; }
    .empty { opacity: .55; font-style: italic; margin: 0 0 8px; }
    .hint { opacity: .55; font-size: 12px; margin: 6px 0 0; }
    #addRule { width: 100%; text-align: left; white-space: normal; overflow-wrap: anywhere; }
    #addRule code { font-family: inherit; opacity: .8; }
  </style>
</head>
<body>
  <section>
    <h2>Send downloads to</h2>
    <div class="row">
      <input id="folder" list="recent" placeholder="e.g. BIO 101" autocomplete="off" autofocus>
      <datalist id="recent"></datalist>
      <button id="set" class="primary">Set</button>
    </div>
    <div id="status" class="status">
      <span class="dot"></span>
      <span class="text" id="statusText">Off — downloads go to the usual place</span>
      <button id="stop" class="small" hidden>Stop</button>
    </div>
  </section>

  <section>
    <h2>Always route these sites</h2>
    <ul id="rules" class="rules"></ul>
    <p id="noRules" class="empty">No rules yet.</p>
    <button id="addRule">+ Route <code id="pageMatch">this page</code> → folder above</button>
    <p class="hint">Site rules apply when nothing is set above. On Canvas, a rule covers the whole course.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
