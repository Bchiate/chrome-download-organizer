name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Manifest is valid JSON with every icon present
        run: node -e "const m=require('./extension/manifest.json'); const fs=require('fs'); for (const f of Object.values(m.icons)) fs.accessSync('extension/'+f)"
      - name: Package for the Chrome Web Store
        run: npm run package
